[project]
name = "rxcadre-sim"
version = "0.1.0"
description = "FDS level-set fire spread calibrated to RxCADRE 2012 S5, plus fictitious scenario generation"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
